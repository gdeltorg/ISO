name: Check iOS Simulator runner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-simulator.yml'

permissions:
  contents: write

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report Apple tooling
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes | tee "$RUNNER_TEMP/simulator-runtimes.txt"
          xcrun simctl list devicetypes | tee "$RUNNER_TEMP/simulator-devicetypes.txt"

      - name: Boot an iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-simulator
          runtime="$(xcrun simctl list runtimes | awk '/iOS/ {print $NF}' | tail -n 1)"
          device_type="$(xcrun simctl list devicetypes | awk -F '[()]' '/iPhone 17 Pro \(/ {print $2; exit}')"
          if [[ -z "$runtime" || -z "$device_type" ]]; then
            echo "No available iOS runtime or iPhone device type was found." >&2
            exit 1
          fi
          device_name="GDELT iPhone Simulator"
          device_id="$(xcrun simctl create "$device_name" "$device_type" "$runtime")"
          trap 'xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true; xcrun simctl delete "$device_id" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl list devices | tee "$RUNNER_TEMP/simulator-devices.txt"
          xcrun simctl diagnose --no-archive --output="$RUNNER_TEMP/simulator-diagnose"
          {
            printf '{"name":"Boot and bootstatus","status":"passed","details":"%s"}\n' "$device_id"
            printf '{"name":"System environment","status":"%s","details":"%s"}\n' \
              "$([ "$(xcrun simctl spawn "$device_id" sw_vers >/dev/null 2>&1; echo $?)" -eq 0 ] && echo passed || echo failed)" \
              "$(xcrun simctl getenv "$device_id" HOME)"
            printf '{"name":"Screenshot capture","status":"%s","details":"simctl io screenshot"}\n' \
              "$([ "$(xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/simulator-screen.png" >/dev/null 2>&1; echo $?)" -eq 0 ] && echo passed || echo failed)"
            printf '{"name":"Appearance control","status":"%s","details":"dark then light"}\n' \
              "$([ "$(xcrun simctl ui "$device_id" appearance dark >/dev/null 2>&1; xcrun simctl ui "$device_id" appearance light >/dev/null 2>&1; echo $?)" -eq 0 ] && echo passed || echo failed)"
            printf '{"name":"Location control","status":"%s","details":"set then clear"}\n' \
              "$([ "$(xcrun simctl location "$device_id" 37.3317,-122.0307 >/dev/null 2>&1; xcrun simctl location "$device_id" clear >/dev/null 2>&1; echo $?)" -eq 0 ] && echo passed || echo failed)"
            printf '{"name":"Privacy and permissions API","status":"%s","details":"simctl privacy help available"}\n' \
              "$([ "$(xcrun simctl privacy help >/dev/null 2>&1; echo $?)" -eq 0 ] && echo passed || echo failed)"
            printf '{"name":"Diagnostics","status":"passed","details":"simctl diagnose"}\n'
          } > "$RUNNER_TEMP/simulator-tests.ndjson"
          python3 - "$RUNNER_TEMP/simulator-tests.ndjson" "$GITHUB_WORKSPACE/ios-simulator/report.json" "$runtime" "$RUNNER_TEMP/simulator-runtimes.txt" "$RUNNER_TEMP/simulator-devicetypes.txt" <<'PY'
          import json
          import pathlib
          import sys
          import re
          from datetime import datetime, timezone
          tests = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          runtime_lines = pathlib.Path(sys.argv[4]).read_text().splitlines()
          runtimes = []
          for line in runtime_lines:
              match = re.search(r'^(iOS [0-9.]+).*?\(([^)]+)\).*-\s+(com\.apple\.CoreSimulator\.SimRuntime\.[^\s]+)', line)
              if match:
                  version, build, identifier = match.groups()
                  runtimes.append({
                      "version": version,
                      "build": build,
                      "identifier": identifier,
                      "availability": "installed on this runner",
                      "official_release_date": {
                          "iOS 18.5": "2025-05-12",
                          "iOS 18.6": "2025-07-29",
                          "iOS 26.0": "2025-09-15",
                          "iOS 26.1": "2025-11-03",
                          "iOS 26.2": "2025-12-12",
                          "iOS 27.0": "2026-09-14"
                      }.get(version, "not verified in this run")
                  })
          device_lines = pathlib.Path(sys.argv[5]).read_text().splitlines()
          devices = []
          for line in device_lines:
              match = re.search(r'^\s*(iPhone.*?)\s+\((com\.apple\.CoreSimulator\.SimDeviceType\.[^)]+)\)', line)
              if match:
                  name, identifier = match.groups()
                  generation = re.search(r'iPhone (6s|7|8|X|11|12|13|14|15|16|17)', name)
                  devices.append({
                      "name": name,
                      "identifier": identifier,
                      "official_release_date": {
                          "iPhone 17 Pro": "2025-09-19",
                          "iPhone 17 Pro Max": "2025-09-19",
                          "iPhone 17": "2025-09-19",
                          "iPhone Air": "2025-09-19"
                      }.get(name, "see Apple technical specifications; not inferred from Simulator"),
                      "family": generation.group(0) if generation else "iPhone"
                  })
          report = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "runtime": sys.argv[3],
              "device": "iPhone 17 Pro",
              "runtime_catalog": runtimes,
              "iphone_simulator_catalog": devices,
              "requested_but_not_installed": [{
                  "version": "iOS 27",
                  "official_release_date": "2026-09-14",
                  "reason": "Not present in the selected GitHub Actions macOS-15 image; this is not evidence that Apple has not released it."
              }] if not any(r["version"].startswith("iOS 27") for r in runtimes) else [],
              "scope": "Apple Simulator and simctl system capabilities; no app-specific or account flows",
              "tests": tests,
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          PY
          # The runtime is passed separately so the report contains the exact
          # identifier selected by simctl rather than a temporary filename.

      - name: Prepare Simulator report page
        if: always()
        run: |
          mkdir -p ios-simulator
          if [ ! -f ios-simulator/report.json ]; then
            cat > ios-simulator/report.json <<'JSON'
          {"generated_at":null,"device":"iPhone 17 Pro","scope":"The Simulator job did not reach report generation.","tests":[]}
          JSON
          fi

      - name: Publish latest Simulator report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios-simulator/report.json
          if git diff --cached --quiet; then
            echo "Simulator report is unchanged."
          else
            git commit -m "Update iOS Simulator test report"
            git push
          fi

      - name: Upload Simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-diagnostics
          path: |
            ${{ runner.temp }}/simulator-devices.txt
            ${{ runner.temp }}/simulator-diagnose
            ${{ runner.temp }}/simulator-screen.png
            ${{ runner.temp }}/simulator-tests.ndjson
          if-no-files-found: ignore
