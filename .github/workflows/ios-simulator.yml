name: Check iOS Simulator runner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-simulator.yml'

permissions:
  contents: write

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report Apple tooling
        run: |
          sw_vers
          sw_vers -productVersion | tee "$RUNNER_TEMP/host-os-version.txt"
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes | tee "$RUNNER_TEMP/simulator-runtimes.txt"
          xcrun simctl list devicetypes | tee "$RUNNER_TEMP/simulator-devicetypes.txt"
          xcrun simctl list devicetypes | awk '/Watch/ {print}' | tee "$RUNNER_TEMP/watch-devicetypes.txt"

      - name: Boot an iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-simulator
          runtime="$(xcrun simctl list runtimes | awk '/iOS/ {print $NF}' | tail -n 1)"
          device_type="$(xcrun simctl list devicetypes | awk -F '[()]' '/iPhone 17 Pro \(/ {print $2; exit}')"
          if [[ -z "$runtime" || -z "$device_type" ]]; then
            echo "No available iOS runtime or iPhone device type was found." >&2
            exit 1
          fi
          device_name="GDELT iPhone Simulator"
          device_id="$(xcrun simctl create "$device_name" "$device_type" "$runtime")"
          trap 'xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true; xcrun simctl delete "$device_id" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl list devices | tee "$RUNNER_TEMP/simulator-devices.txt"
          xcrun simctl diagnose --no-archive --output="$RUNNER_TEMP/simulator-diagnose"
          {
            printf '{"name":"Boot and bootstatus","status":"passed","details":"%s"}\n' "$device_id"
            printf '{"name":"System environment","status":"%s","details":"%s"}\n' \
              "$([ "$(xcrun simctl spawn "$device_id" sw_vers >/dev/null 2>&1; echo $?)" -eq 0 ] && echo passed || echo failed)" \
              "$(xcrun simctl getenv "$device_id" HOME)"
            printf '{"name":"Screenshot capture","status":"%s","details":"simctl io screenshot"}\n' \
              "$([ "$(xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/simulator-screen.png" >/dev/null 2>&1; echo $?)" -eq 0 ] && echo passed || echo failed)"
            printf '{"name":"Appearance control","status":"%s","details":"dark then light"}\n' \
              "$([ "$(xcrun simctl ui "$device_id" appearance dark >/dev/null 2>&1; xcrun simctl ui "$device_id" appearance light >/dev/null 2>&1; echo $?)" -eq 0 ] && echo passed || echo failed)"
            printf '{"name":"Location control","status":"%s","details":"set then clear"}\n' \
              "$([ "$(xcrun simctl location "$device_id" 37.3317,-122.0307 >/dev/null 2>&1; xcrun simctl location "$device_id" clear >/dev/null 2>&1; echo $?)" -eq 0 ] && echo passed || echo failed)"
            printf '{"name":"Privacy and permissions API","status":"%s","details":"simctl privacy help available"}\n' \
              "$([ "$(xcrun simctl privacy help >/dev/null 2>&1; echo $?)" -eq 0 ] && echo passed || echo failed)"
            printf '{"name":"Diagnostics","status":"passed","details":"simctl diagnose"}\n'
          } > "$RUNNER_TEMP/simulator-tests.ndjson"
          python3 - "$RUNNER_TEMP/simulator-tests.ndjson" "$GITHUB_WORKSPACE/ios-simulator/report.json" "$runtime" "$RUNNER_TEMP/simulator-runtimes.txt" "$RUNNER_TEMP/simulator-devicetypes.txt" "$RUNNER_TEMP/host-os-version.txt" "$RUNNER_TEMP/watch-devicetypes.txt" <<'PY'
          import json
          import pathlib
          import sys
          import re
          from datetime import datetime, timezone
          tests = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          runtime_lines = pathlib.Path(sys.argv[4]).read_text().splitlines()
          host_os_version = pathlib.Path(sys.argv[6]).read_text().strip()
          watch_device_lines = pathlib.Path(sys.argv[7]).read_text().splitlines()
          runtimes = []
          apple_os = []
          release_dates = {
              "iOS 18.5": "2025-05-12", "iOS 18.6": "2025-07-29",
              "iOS 26.0": "2025-09-15", "iOS 26.1": "2025-11-03",
              "iOS 26.2": "2025-12-12", "iOS 27.0": "2026-09-14",
              "tvOS 18.5": "2025-05-12", "tvOS 26.1": "2025-11-03",
              "tvOS 26.2": "2025-12-12", "watchOS 11.5": "2025-05-12",
              "watchOS 26.1": "2025-11-03", "watchOS 26.2": "2025-12-12",
              "visionOS 2.3": "2024-12-11", "visionOS 2.4": "2025-01-31",
              "visionOS 2.5": "2025-05-12", "visionOS 26.1": "2025-11-03",
              "visionOS 26.2": "2025-12-12"
          }
          for line in runtime_lines:
              match = re.search(r'^((?:iOS|tvOS|watchOS|visionOS) [0-9.]+).*?\(([^)]+)\).*-\s+(com\.apple\.CoreSimulator\.SimRuntime\.[^\s]+)', line)
              if match:
                  version, build, identifier = match.groups()
                  item = {
                      "version": version,
                      "build": build,
                      "identifier": identifier,
                      "availability": "installed on this runner",
                      "official_release_date": release_dates.get(version, "not verified in this run"),
                      "runner_install_date": "not publicly recorded",
                      "runner_observed_at": datetime.now(timezone.utc).isoformat()
                  }
                  apple_os.append(item)
                  if version.startswith("iOS "):
                      runtimes.append(item)
          device_lines = pathlib.Path(sys.argv[5]).read_text().splitlines()
          devices = []
          ipads = []
          for line in device_lines:
              match = re.search(r'^\s*((?:iPhone|iPad).*?)\s+\((com\.apple\.CoreSimulator\.SimDeviceType\.[^)]+)\)', line)
              if match:
                  name, identifier = match.groups()
                  generation = re.search(r'iPhone (6s|7|8|X|11|12|13|14|15|16|17)', name)
                  item = {
                      "name": name,
                      "identifier": identifier,
                      "official_release_date": {
                          "iPhone 6s": "2015-09-25",
                          "iPhone 6s Plus": "2015-09-25",
                          "iPhone SE (1st generation)": "2016-03-31",
                          "iPhone 7": "2016-09-16",
                          "iPhone 7 Plus": "2016-09-16",
                          "iPhone 8": "2017-09-22",
                          "iPhone 8 Plus": "2017-09-22",
                          "iPhone X": "2017-11-03",
                          "iPhone Xs": "2018-09-21",
                          "iPhone Xs Max": "2018-09-21",
                          "iPhone Xʀ": "2018-10-26",
                          "iPhone 11": "2019-09-20",
                          "iPhone 11 Pro": "2019-09-20",
                          "iPhone 11 Pro Max": "2019-09-20",
                          "iPhone SE (2nd generation)": "2020-04-24",
                          "iPhone 12": "2020-10-23",
                          "iPhone 12 Pro": "2020-10-23",
                          "iPhone 12 mini": "2020-11-13",
                          "iPhone 12 Pro Max": "2020-11-13",
                          "iPhone 13": "2021-09-24",
                          "iPhone 13 mini": "2021-09-24",
                          "iPhone 13 Pro": "2021-09-24",
                          "iPhone 13 Pro Max": "2021-09-24",
                          "iPhone SE (3rd generation)": "2022-03-18",
                          "iPhone 14": "2022-09-16",
                          "iPhone 14 Pro": "2022-09-16",
                          "iPhone 14 Pro Max": "2022-09-16",
                          "iPhone 14 Plus": "2022-10-07",
                          "iPhone 15": "2023-09-22",
                          "iPhone 15 Plus": "2023-09-22",
                          "iPhone 15 Pro": "2023-09-22",
                          "iPhone 15 Pro Max": "2023-09-22",
                          "iPhone 16": "2024-09-20",
                          "iPhone 16 Plus": "2024-09-20",
                          "iPhone 16 Pro": "2024-09-20",
                          "iPhone 16 Pro Max": "2024-09-20",
                          "iPhone 16e": "2025-02-28",
                          "iPhone 17 Pro": "2025-09-19",
                          "iPhone 17 Pro Max": "2025-09-19",
                          "iPhone 17": "2025-09-19",
                          "iPhone Air": "2025-09-19"
                      }.get(name, "see Apple technical specifications; not inferred from Simulator"),
                      "runner_install_date": "not publicly recorded",
                      "runner_observed_at": datetime.now(timezone.utc).isoformat(),
                      "family": generation.group(0) if generation else "iPhone"
                  }
                  if name.startswith("iPad"):
                      item["family"] = "iPad"
                      ipads.append(item)
                  else:
                      devices.append(item)
          watch_devices = []
          for line in watch_device_lines:
              match = re.search(r'^\s*(Apple Watch.*?)\s+\((com\.apple\.CoreSimulator\.SimDeviceType\.[^)]+)\)', line)
              if match:
                  watch_devices.append({"name": match.group(1), "identifier": match.group(2)})
          report = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "runtime": sys.argv[3],
              "device": "iPhone 17 Pro",
              "runner_catalog": [
                  {"label": "macos-15", "os": "macOS Sequoia 15", "os_release_date": "2024-09-16", "observed_os_version": host_os_version, "architecture": "arm64 (M1)", "cpu": 3, "ram_gb": 7, "storage_gb": 14, "status": "public standard"},
                  {"label": "macos-15-intel", "os": "macOS Sequoia 15", "os_release_date": "2024-09-16", "observed_os_version": "not observed in this run", "architecture": "x86_64 Intel", "cpu": 4, "ram_gb": 14, "storage_gb": 14, "status": "public standard"},
                  {"label": "macos-14", "os": "macOS Sonoma 14", "os_release_date": "2023-09-26", "observed_os_version": "not observed in this run", "architecture": "arm64 (M1)", "cpu": 3, "ram_gb": 7, "storage_gb": 14, "status": "public standard"},
                  {"label": "macos-26", "os": "macOS Tahoe 26", "os_release_date": "2025-09-15", "observed_os_version": "not observed in this run", "architecture": "arm64", "cpu": 3, "ram_gb": 7, "storage_gb": 14, "status": "public standard"},
                  {"label": "macos-26-intel", "os": "macOS Tahoe 26", "os_release_date": "2025-09-15", "observed_os_version": "not observed in this run", "architecture": "x86_64 Intel", "cpu": 4, "ram_gb": 14, "storage_gb": 14, "status": "public standard"},
                  {"label": "macos-latest", "os": "macOS version follows GitHub latest", "os_release_date": "see selected image", "observed_os_version": "not observed in this run", "architecture": "arm64", "cpu": 3, "ram_gb": 7, "storage_gb": 14, "status": "moving label"},
                  {"label": "xcode-27", "os": "macOS Tahoe 26", "os_release_date": "2025-09-15", "observed_os_version": "not observed in this run", "architecture": "arm64", "cpu": 3, "ram_gb": 7, "storage_gb": 14, "status": "public preview"},
                  {"label": "ubuntu-24.04", "os": "Ubuntu 24.04 LTS", "os_release_date": "2024-04-25", "observed_os_version": "not observed in this run", "architecture": "x86_64", "cpu": 4, "ram_gb": 16, "storage_gb": 14, "status": "public standard"},
                  {"label": "ubuntu-22.04", "os": "Ubuntu 22.04 LTS", "os_release_date": "2022-04-21", "observed_os_version": "not observed in this run", "architecture": "x86_64", "cpu": 4, "ram_gb": 16, "storage_gb": 14, "status": "public standard"},
                  {"label": "ubuntu-slim", "os": "Ubuntu slim (version follows image)", "os_release_date": "see selected image", "observed_os_version": "not observed in this run", "architecture": "x86_64", "cpu": 1, "ram_gb": 5, "storage_gb": 14, "status": "public standard"},
                  {"label": "windows-2025", "os": "Windows Server 2025", "os_release_date": "2024-11-01", "observed_os_version": "not observed in this run", "architecture": "x86_64", "cpu": 4, "ram_gb": 16, "storage_gb": 14, "status": "public standard"},
                  {"label": "windows-2022", "os": "Windows Server 2022", "os_release_date": "2021-08-18", "observed_os_version": "not observed in this run", "architecture": "x86_64", "cpu": 4, "ram_gb": 16, "storage_gb": 14, "status": "public standard"}
              ],
              "operating_system_catalog": [
                  {"vendor": "Apple", "family": "macOS", "version": "14 Sonoma", "official_release_date": "2023-09-26", "runner_labels": "macos-14", "status": "GitHub label"},
                  {"vendor": "Apple", "family": "macOS", "version": "15 Sequoia", "official_release_date": "2024-09-16", "runner_labels": "macos-15, macos-15-intel", "status": "GitHub label"},
                  {"vendor": "Apple", "family": "macOS", "version": "26 Tahoe", "official_release_date": "2025-09-15", "runner_labels": "macos-26, macos-26-intel, xcode-27", "status": "GitHub label / preview"},
                  {"vendor": "Microsoft", "family": "Windows Server", "version": "2025", "official_release_date": "2024-11-01", "runner_labels": "windows-2025", "status": "GitHub label"},
                  {"vendor": "Microsoft", "family": "Windows Server", "version": "2022", "official_release_date": "2021-08-18", "runner_labels": "windows-2022", "status": "GitHub label"},
                  {"vendor": "Canonical", "family": "Ubuntu", "version": "24.04 LTS", "official_release_date": "2024-04-25", "runner_labels": "ubuntu-24.04", "status": "GitHub label"},
                  {"vendor": "Canonical", "family": "Ubuntu", "version": "22.04 LTS", "official_release_date": "2022-04-21", "runner_labels": "ubuntu-22.04, ubuntu-latest", "status": "GitHub label"}
              ],
              "cloud_instance_catalog": [
                  {"provider": "Microsoft Azure", "instance_type": "Standard_DS2_v2", "vcpus": 2, "ram_gib": 7, "disk": "14 GB runner workspace (cloud VM disk is provider-managed)", "runner_labels": "ubuntu-slim / 2-vCPU class", "basis": "closest published CPU/RAM profile", "status": "reference equivalent, not confirmed GitHub backing instance"},
                  {"provider": "Microsoft Azure", "instance_type": "Standard_D4s_v5", "vcpus": 4, "ram_gib": 16, "disk": "14 GB runner workspace (cloud VM disk is provider-managed)", "runner_labels": "ubuntu-24.04, ubuntu-22.04, windows-2025, windows-2022", "basis": "closest published CPU/RAM profile", "status": "reference equivalent, not confirmed GitHub backing instance"},
                  {"provider": "Amazon Web Services", "instance_type": "m5.large", "vcpus": 2, "ram_gib": 8, "disk": "14 GB runner workspace (EBS backing not specified)", "runner_labels": "ubuntu-slim / 2-vCPU class", "basis": "closest published CPU/RAM profile", "status": "reference equivalent, not confirmed GitHub backing instance"},
                  {"provider": "Amazon Web Services", "instance_type": "m5.xlarge", "vcpus": 4, "ram_gib": 16, "disk": "14 GB runner workspace (EBS backing not specified)", "runner_labels": "ubuntu-24.04, ubuntu-22.04, windows-2025, windows-2022", "basis": "closest published CPU/RAM profile", "status": "reference equivalent, not confirmed GitHub backing instance"},
                  {"provider": "Google Cloud", "instance_type": "e2-standard-2", "vcpus": 2, "ram_gib": 8, "disk": "14 GB runner workspace (persistent disk not specified)", "runner_labels": "ubuntu-slim / 2-vCPU class", "basis": "closest published CPU/RAM profile", "status": "reference equivalent, not confirmed GitHub backing instance"},
                  {"provider": "Google Cloud", "instance_type": "e2-standard-4", "vcpus": 4, "ram_gib": 16, "disk": "14 GB runner workspace (persistent disk not specified)", "runner_labels": "ubuntu-24.04, ubuntu-22.04, windows-2025, windows-2022", "basis": "closest published CPU/RAM profile", "status": "reference equivalent, not confirmed GitHub backing instance"}
              ],
              "apple_compatibility_catalog": [
                  {"platform": "iOS", "os_version": "iOS 18.5", "official_release_date": "2025-05-12", "hardware": "iPhone 6s and later; iPad Air 2 and later; iPad mini 4 and later; iPad Pro", "simulator_profiles": "iPhone/iPad profiles available in installed Xcode image", "runner_status": "Runtime-specific availability detected above", "official_url": "https://support.apple.com/en-us/121161"},
                  {"platform": "iOS", "os_version": "iOS 18.6", "official_release_date": "2025-07-29", "hardware": "iPhone 6s and later; iPad Air 2 and later; iPad mini 4 and later; iPad Pro", "simulator_profiles": "iPhone/iPad profiles available in installed Xcode image", "runner_status": "Runtime-specific availability detected above", "official_url": "https://support.apple.com/en-us/121161"},
                  {"platform": "iOS", "os_version": "iOS 26.0", "official_release_date": "2025-09-15", "hardware": "iPhone 11 and later; iPhone SE (2nd generation) and later; supported iPad models", "simulator_profiles": "iPhone/iPad profiles available in installed Xcode image", "runner_status": "Runtime-specific availability detected above", "official_url": "https://support.apple.com/en-us/123075"},
                  {"platform": "watchOS", "os_version": "watchOS 27.0.1", "official_release_date": "2026-09-23", "hardware": "Apple Watch Series 12; Apple Watch Ultra 4", "simulator_profiles": "Apple Watch profiles required; check watchOS runtime catalog", "runner_status": "Not assumed installed from security-update publication alone", "official_url": "https://support.apple.com/en-us/100100"},
                  {"platform": "macOS", "os_version": "macOS Sequoia 15", "official_release_date": "2024-09-16", "hardware": "MacBook Air/Pro; iMac; Mac mini; Mac Studio; Mac Pro models supported by Apple", "simulator_profiles": "Host operating system for Xcode Simulator", "runner_status": "macOS-15 runner observed", "official_url": "https://support.apple.com/en-us/121115"},
                  {"platform": "macOS", "os_version": "macOS Tahoe 26", "official_release_date": "2025-09-15", "hardware": "Apple silicon Mac models and supported Intel Macs", "simulator_profiles": "Host operating system for Xcode Simulator", "runner_status": "Available only when selected runner image provides it", "official_url": "https://support.apple.com/en-us/122867"}
              ],
              "watchos_simulator": {
                  "runtime_versions": [r for r in apple_os if r["version"].startswith("watchOS ")],
                  "device_types": watch_devices,
                  "status": "runtime and device profiles detected; create/boot test not run" if any(r["version"].startswith("watchOS ") for r in apple_os) and watch_devices else "not available in this runner image"
              },
              "apple_os_catalog": apple_os,
              "runtime_catalog": runtimes,
              "iphone_simulator_catalog": devices,
              "ipad_simulator_catalog": ipads,
              "requested_but_not_installed": [{
                  "version": "iOS 27",
                  "official_release_date": "2026-09-14",
                  "runner_install_date": "not publicly recorded",
                  "reason": "Not present in the selected GitHub Actions macOS-15 image; this is not evidence that Apple has not released it."
              }] if not any(r["version"].startswith("iOS 27") for r in runtimes) else [],
              "scope": "Apple Simulator and simctl system capabilities; no app-specific or account flows",
              "tests": tests,
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          PY
          # The runtime is passed separately so the report contains the exact
          # identifier selected by simctl rather than a temporary filename.

      - name: Prepare Simulator report page
        if: always()
        run: |
          mkdir -p ios-simulator
          if [ ! -f ios-simulator/report.json ]; then
            cat > ios-simulator/report.json <<'JSON'
          {"generated_at":null,"device":"iPhone 17 Pro","scope":"The Simulator job did not reach report generation.","tests":[]}
          JSON
          fi

      - name: Publish latest Simulator report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios-simulator/report.json
          if git diff --cached --quiet; then
            echo "Simulator report is unchanged."
          else
            git commit -m "Update iOS Simulator test report"
            git pull --rebase origin main
            git push
          fi

      - name: Upload Simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-diagnostics
          path: |
            ${{ runner.temp }}/simulator-devices.txt
            ${{ runner.temp }}/simulator-diagnose
            ${{ runner.temp }}/simulator-screen.png
            ${{ runner.temp }}/simulator-tests.ndjson
          if-no-files-found: ignore
