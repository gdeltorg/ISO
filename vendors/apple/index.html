<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple release catalog | GDELT ISO</title>
<style>body{font:15px system-ui,sans-serif;max-width:1400px;margin:2rem auto;padding:0 1rem;color:#172033}.meta{color:#5d687d}table{border-collapse:collapse;width:100%;margin-top:1rem}th,td{border-bottom:1px solid #dfe3ea;padding:.6rem;text-align:left;vertical-align:top}input{font:inherit;padding:.45rem;width:22rem}</style>
<h1>Apple 硬件与软件发布表</h1><p class="meta">例如 iPhone 18：若 Apple 尚未正式发布或 Runner 未检测到对应 profile，明确标为未核实/无证据，不推断发布时间。</p><input id="q" placeholder="搜索 iPhone、iOS、Runner…"><table><thead><tr><th>类别</th><th>产品</th><th>版本</th><th>官方发布时间</th><th>发布状态</th><th>Runner 标签</th><th>是否有 Runner 证据</th><th>证据/安装</th><th>来源</th></tr></thead><tbody id="rows"></tbody></table><p><a href="../">返回厂商目录</a> · <a href="../../">主页</a></p>
<script>const q=document.getElementById("q");let rows=[];fetch("../../ios-simulator/report.json?x="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{rows=(d.vendor_release_catalog||[]).filter(x=>x.vendor==="Apple");draw()});function e(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function draw(){let s=q.value.toLowerCase();document.getElementById("rows").innerHTML=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(s)).map(x=>`<tr><td>${e(x.category)}</td><td>${e(x.product)}</td><td>${e(x.version)}</td><td>${e(x.official_release_date)}</td><td>${e(x.release_status)}</td><td><code>${e(x.runner_labels)}</code></td><td>${e(x.runner_present)}</td><td>${e(x.runner_evidence)}<br>${e(x.manual_install)}</td><td><a href="${e(x.official_url)}" target="_blank">官方</a></td></tr>`).join("")}q.oninput=draw;</script>
