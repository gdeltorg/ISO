<h1>Canonical 硬件与软件发布表</h1><p class="meta">Ubuntu Runner 标签与云实例参考分开记录；GitHub 不公开其 hosted runner 的确切底层 VM。</p><table><thead><tr><th>类别</th><th>产品</th><th>版本</th><th>官方发布时间</th><th>状态</th><th>Runner 标签</th><th>Runner/安装说明</th><th>来源</th></tr></thead><tbody id="rows"></tbody></table><p><a href="../">返回厂商目录</a> · <a href="../../">主页</a></p><script>fetch("../../ios-simulator/report.json?x="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>document.getElementById("rows").innerHTML=(d.vendor_release_catalog||[]).filter(x=>x.vendor==="Canonical").map(x=>`<tr><td>${x.category}</td><td>${x.product}</td><td>${x.version}</td><td>${x.official_release_date}</td><td>${x.release_status}</td><td><code>${x.runner_labels}</code></td><td>${x.runner_present}<br>${x.manual_install}</td><td><a href="${x.official_url}" target="_blank">官方</a></td></tr>`).join(""))</script>
